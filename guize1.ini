[custom]

; ==================================================
; 1. 排除订阅中的无用节点信息
; ==================================================
exclude_remarks=(剩余流量|距离下次重置|套餐到期|更新已完成|尽快在使用教程|国内入口|固定入口|Telegram讨论群组|Telegram频道)

; ==================================================
; 2. 特殊直连规则
; 优先级最高，保留局域网及特殊国内服务
; ==================================================
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list

; ==================================================
; 3. 七个应用专用分流
; YouTube 放在 Google 前面，避免规则交叉
; ==================================================
ruleset=📹 YouTube,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list

ruleset=🤖 AI,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/AI.list
ruleset=🤖 AI,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list

ruleset=🍀 Google,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.list

ruleset=🎵 TikTok,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TikTok/TikTok.list

ruleset=📲 Telegram,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list

; ==================================================
; 4. 游戏专用分流
; 日服游戏优先于游戏平台
; ==================================================
ruleset=🎮 日服游戏,https://raw.githubusercontent.com/iriya123/guize/refs/heads/main/jpgame.list

ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Epic.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Origin.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Sony.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Steam.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Nintendo.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Blizzard/Blizzard.list

; ==================================================
; 5. 用户自己的直连规则
; 必须完整保留，不删除、不裁剪
; ==================================================
ruleset=🎯 全球直连,https://raw.githubusercontent.com/iriya123/guize/refs/heads/main/Direct.list

; ==================================================
; 6. 中国大陆直连规则
; 域名规则优先于 IP 规则
; ==================================================
ruleset=🎯 全球直连,[]GEOSITE,cn
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,[]GEOIP,CN

; ==================================================
; 7. 海外通用代理与最终兜底
; ==================================================
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list
ruleset=🚀 节点选择,[]GEOSITE,geolocation-!cn
ruleset=🐟 漏网之鱼,[]FINAL

; ==================================================
; 8. 主策略组
; ==================================================
custom_proxy_group=🚀 节点选择`select`[]📶 机场选择`[]🌐 其他地区`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇰🇷 韩国`[]🇺🇸 美国`[]🐸 手动切换`[]♻️ 自动选择`[]DIRECT

; ==================================================
; 9. 机场入口
; ==================================================
custom_proxy_group=📶 机场选择`select`[]⓵ 大机场`[]⓶ 鸡场`[]⓷ 遥遥领先

custom_proxy_group=⓵ 大机场`url-test`^(日本 A[12]|首尔 A[12]|新加坡 A[12]|香港 A[12]|美国 A[12])$`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=⓶ 鸡场`url-test`^(香港|东京|新加坡|美国)$`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=⓷ 遥遥领先`url-test`.*(US-美国-|JP-日本-|HK-香港-|TW-台湾-|SG-新加坡-|AU-澳大利亚-|DE-德国-|KR-韩国-|GB-英国-|VN-越南-).*`http://www.gstatic.com/generate_204`300,,50

; ==================================================
; 10. 七个应用策略组
; ==================================================
custom_proxy_group=📹 YouTube`select`[]🚀 节点选择`[]📶 机场选择`[]🌐 其他地区`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇰🇷 韩国`[]🇺🇸 美国`[]🐸 手动切换`[]♻️ 自动选择

custom_proxy_group=🤖 AI`select`[]🚀 节点选择`[]📶 机场选择`[]🌐 其他地区`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇰🇷 韩国`[]🇺🇸 美国`[]🐸 手动切换`[]♻️ 自动选择

custom_proxy_group=🍀 Google`select`[]🚀 节点选择`[]📶 机场选择`[]🌐 其他地区`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇰🇷 韩国`[]🇺🇸 美国`[]🐸 手动切换`[]♻️ 自动选择

custom_proxy_group=🎵 TikTok`select`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇰🇷 韩国`[]🇺🇸 美国`[]🌐 其他地区`[]🚀 节点选择

custom_proxy_group=📲 Telegram`select`[]🚀 节点选择`[]📶 机场选择`[]🌐 其他地区`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇰🇷 韩国`[]🇺🇸 美国`[]🐸 手动切换`[]♻️ 自动选择

custom_proxy_group=🎮 日服游戏`select`[]🇯🇵 日本`[]📶 机场选择`[]🚀 节点选择`[]🐸 手动切换`[]♻️ 自动选择

custom_proxy_group=🎮 游戏平台`select`[]🚀 节点选择`[]📶 机场选择`[]🌐 其他地区`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇰🇷 韩国`[]🇺🇸 美国`[]🐸 手动切换`[]♻️ 自动选择

; ==================================================
; 11. 直连与漏网之鱼
; ==================================================
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择

custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]📶 机场选择`[]🌐 其他地区`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇰🇷 韩国`[]🇺🇸 美国`[]🐸 手动切换`[]♻️ 自动选择

; ==================================================
; 12. 地区自动测速组
; ==================================================
custom_proxy_group=🌐 其他地区`url-test`.*(澳大利亚|德国|英国|越南|法国|加拿大|印度|土耳其|泰国|菲律宾|马来西亚|印尼|巴西|阿根廷|俄罗斯|瑞士|荷兰|意大利|西班牙|新西兰|波兰|瑞典|芬兰|爱尔兰|墨西哥|阿联酋|南非|AU-|DE-|GB-|VN-|FR-|CA-|IN-|TR-|TH-|PH-|MY-|ID-|BR-|AR-|RU-|CH-|NL-|IT-|ES-|NZ-|PL-|SE-|FI-|IE-|MX-|AE-|ZA-).*`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🇭🇰 香港`url-test`.*(香港|HK-).*`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🇹🇼 台湾`url-test`.*(台湾|台北|TW-).*`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🇯🇵 日本`url-test`.*(日本|东京|大阪|JP-).*`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🇸🇬 新加坡`url-test`.*(新加坡|SG-).*`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🇰🇷 韩国`url-test`.*(韩国|首尔|KR-).*`http://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🇺🇸 美国`url-test`.*(美国|US-).*`http://www.gstatic.com/generate_204`300,,50

; ==================================================
; 13. 手动切换与全局自动测速
; ==================================================
custom_proxy_group=🐸 手动切换`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50

; ==================================================
; 14. 规则生成设置
; ==================================================
enable_rule_generator=true
overwrite_original_rules=true
