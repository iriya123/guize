custom_proxy_group=🇺🇸 美国`url-test`^(美国 A1|美国 A2|美国|US-美国-13|US-美国-12|US-美国-9⁰˙⁰²ˣ|US-美国-7|US-美国-3⁰˙⁰⁴ˣ|US-美国-1)$`http://www.gstatic.com/generate_204`180,,200


; -------------------------
