custom_proxy_group=🇸🇬 新加坡`url-test`^(新加坡 A1|新加坡 A2|新加坡|SG-新加坡-11|SG-新加坡-4|SG-新加坡-2|SG-新加坡-1)$`http://www.gstatic.com/generate_204`180,,200

