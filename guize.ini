custom_proxy_group=🇭🇰 香港节点`url-test`(?=.*(香港|HK|Hong Kong|🇭🇰|HongKong))^((?!(深港|US|家宽|游戏|剩余|流量|2.0|2倍|2x|3.0|3倍|3x|4.0|4倍|4x)).)*$`http://gstatic.com`300,,50
custom_proxy_group=🇯🇵 日本节点`url-test`(?=.*(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan))^((?!(家宽|游戏|剩余|流量|2.0|2倍|2x|3.0|3倍|3x|4.0|4倍|4x)).)*$`http://gstatic.com`300,,50
custom_proxy_group=🇸🇬 加坡节点`url-test`(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(家宽|游戏|剩余|流量|2.0|2倍|2x|3.0|3倍|3x|4.0|4倍|4x)).)*$`http://gstatic.com`300,,50
custom_proxy_group=🇺🇲 美国节点`url-test`(?=.*(美国|US|United States|🇺🇸))^((?!(家宽|游戏|剩余|流量|2.0|2倍|2x|3.0|3倍|3x|4.0|4倍|4x)).)*$`http://gstatic.com`300,,50
custom_proxy_group=🌐 其他地区`select`^((?!(香港|HK|日本|JP|新加坡|SG|美国|US)).)*$
custom_proxy_group=🛩️ 高速-自动`url-test`(?=.*(5x))^((?!(接入点|测试)).)*$`http://gstatic.com`300,,50
;机场自定义
custom_proxy_group=⓵ 大机场`url-test`(?=.*(SS))^((?!(接入点|测试)).)*$`http://gstatic.com`300,,50
custom_proxy_group=⓶ 鸡场`url-test`(?=.*(A))^((?!(中转|接入)).)*$`http://gstatic.com`300,,50
custom_proxy_group=③ 遥遥领先`url-test`(?=.*(US-美国|JP-日本|HK-香港|TW-台湾|SG-新加坡|AU-澳大利亚|DE-德国|GB-英国|VN-越南|NL-荷兰))^((?!(中转|接入)).)*$`http://gstatic.com`300,,50
custom_proxy_group=♻️ 自动选择`url-test`.*`http://gstatic.com`300,,50

custom_proxy_group=🎥 奈飞节点`select`(NF|奈飞|解锁|Netflix|NETFLIX|Media)

